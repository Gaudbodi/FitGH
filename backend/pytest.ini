[pytest]
testpaths = tests
addopts = -ra --strict-markers
filterwarnings =
    # Suppress DeprecationWarnings from third-party libs (mongomock, pyjwt) that
    # we cannot control. Anything from app.* should still bubble up.
    ignore::DeprecationWarning:mongomock.*
    ignore::DeprecationWarning:pymongo.*
