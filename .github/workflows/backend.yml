name: backend

on:
  push:
    branches: [main, master]
    paths:
      - "backend/**"
      - ".github/workflows/backend.yml"
  pull_request:
    branches: [main, master]
    paths:
      - "backend/**"
      - ".github/workflows/backend.yml"

# Phase 1 plan WS-0.5 + WS-B.6. Jobs are stubs until Slice B wires real targets,
# then `continue-on-error` is flipped to false.

permissions:
  contents: read

defaults:
  run:
    working-directory: backend

jobs:
  lint-test:
    name: ruff + pytest
    runs-on: ubuntu-latest
    # Flip to false in WS-B.6 once tests exist.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements*.txt

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt
        if: ${{ hashFiles('backend/requirements.txt') != '' }}

      - name: Ruff lint
        run: ruff check .
        if: ${{ hashFiles('backend/requirements-dev.txt') != '' }}

      - name: Pytest
        run: pytest -x
        if: ${{ hashFiles('backend/tests') != '' }}

  docker-build-smoke:
    name: docker build smoke
    runs-on: ubuntu-latest
    # Flip to false in WS-B.6 once Dockerfile exists.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t fitgh-api:smoke .
        if: ${{ hashFiles('backend/Dockerfile') != '' }}
