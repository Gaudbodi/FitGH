name: frontend

on:
  push:
    branches: [main, master]
    paths:
      - "frontend/**"
      - ".github/workflows/frontend.yml"
  pull_request:
    branches: [main, master]
    paths:
      - "frontend/**"
      - ".github/workflows/frontend.yml"

# Phase 1 plan WS-A.5. Slices A wired the real targets; flags below are
# continue-on-error=false now — the gates enforce.

permissions:
  contents: read
  pull-requests: write  # required for andresz1/size-limit-action PR comments

defaults:
  run:
    working-directory: frontend

jobs:
  lint-typecheck-build:
    name: lint + typecheck + build
    runs-on: ubuntu-latest
    continue-on-error: false
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm tsc --noEmit

      - name: Build
        run: pnpm build

  size-limit:
    name: size-limit (180 KB First Load JS gate)
    runs-on: ubuntu-latest
    # WS-A.5: gate is live. PRs that push First Load JS above 180 KB gzipped
    # on /dashboard MUST fail this job. Smoke-tested via a deliberate Three.js
    # bloat PR; see SUMMARY.md for the smoke-test PR URL.
    continue-on-error: false
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      # andresz1/size-limit-action installs pnpm deps, runs `pnpm build`, then
      # `pnpm size` and posts a comment on the PR with the delta vs base branch.
      # Falls back to plain `pnpm size` invocation on push events.
      - name: size-limit (PR comment + gate)
        uses: andresz1/size-limit-action@v1
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          directory: frontend
          package_manager: pnpm
          skip_step: install  # we install via pnpm/action-setup above
        env:
          # andresz1/size-limit-action runs `pnpm install` itself unless
          # skip_step=install; we let it run install in CI to avoid duplication.
          CI: true
