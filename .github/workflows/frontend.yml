name: frontend

on:
  push:
    branches: [main, master]
    paths:
      - "frontend/**"
      - ".github/workflows/frontend.yml"
  pull_request:
    branches: [main, master]
    paths:
      - "frontend/**"
      - ".github/workflows/frontend.yml"

# Phase 1 plan WS-0.5 + WS-A.5. Jobs are stubs until Slice A wires real targets,
# then `continue-on-error` is flipped to false to enforce the gate.

permissions:
  contents: read

defaults:
  run:
    working-directory: frontend

jobs:
  lint-typecheck-build:
    name: lint + typecheck + build
    runs-on: ubuntu-latest
    # Flip to false in Slice A once frontend/package.json has the targets wired.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install
        run: pnpm install --frozen-lockfile
        # Stub: skip gracefully if frontend/ not yet scaffolded.
        if: ${{ hashFiles('frontend/package.json') != '' }}

      - name: Lint
        run: pnpm lint
        if: ${{ hashFiles('frontend/package.json') != '' }}

      - name: Typecheck
        run: pnpm tsc --noEmit
        if: ${{ hashFiles('frontend/tsconfig.json') != '' }}

      - name: Build
        run: pnpm build
        if: ${{ hashFiles('frontend/package.json') != '' }}

  size-limit:
    name: size-limit (180 KB First Load JS gate)
    runs-on: ubuntu-latest
    # Flip to false in WS-A.5 once .size-limit.json is wired and the smoke test
    # has proved a bloated PR fails the build.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install
        run: pnpm install --frozen-lockfile
        if: ${{ hashFiles('frontend/.size-limit.json') != '' }}

      - name: Build
        run: pnpm build
        if: ${{ hashFiles('frontend/.size-limit.json') != '' }}

      - name: size-limit
        run: pnpm size
        if: ${{ hashFiles('frontend/.size-limit.json') != '' }}
