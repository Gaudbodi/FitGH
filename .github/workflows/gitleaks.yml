name: gitleaks

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

# Block PRs that contain secrets. Not continue-on-error — fail PRs from day 1.
# Phase 1 plan WS-0.5 / SEC-01.

permissions:
  contents: read
  pull-requests: read

jobs:
  secret-scan:
    name: gitleaks secret scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (full history for diff scanning)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Use the repo .gitleaks.toml with our custom MongoDB / Clerk / Sentry rules.
          GITLEAKS_CONFIG: .gitleaks.toml
